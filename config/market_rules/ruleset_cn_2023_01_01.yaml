      fee_schedule_id: CN-EQUITY-DEFAULT
    - profile_id: SSE_MAIN-A_SHARE-RISK-WARNING
      description: >-
        SSE main-board risk-warning (ST/*ST) A-share replay baseline: 5%
        configured daily price limit, T+1, 0.01 tick, 100-share buy lot. The
        historical percentage is unverified; do not use this for research.
      exchange: SSE
      board: SSE_MAIN
      instrument_type: A_SHARE
      risk_warning_only: true
      settlement_rule: T_PLUS_1
      tick_size: "0.01"
      price_limit_pct: "0.05"
      risk_warning_price_limit_pct: "0.05"
