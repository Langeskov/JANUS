# Alembic configuration for JANUS Phase 0.
#
# Run from the repository root:
#     uv run alembic upgrade head
#     uv run alembic current
#     uv run alembic downgrade base
#
# The database URL can be overridden without editing this file:
#     $env:JANUS_DB_URL = "sqlite:///data/local/janus.db"
#
# Schema source of truth: janus/infrastructure/database/tables.py
# (imported by migrations/env.py). Never hand-edit the database schema.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Development default; JANUS_DB_URL overrides it (see migrations/env.py).
sqlalchemy.url = sqlite:///data/local/janus.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARNING keeps normal CLI/API output clean; raise to INFO only when debugging
# migrations (JANUS applies migrations on startup).
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
